site_name: MwInSilico — Márcio Wilson
site_description: Tutoriais, scripts e postagens de bioinformática — genômica, transcriptômica e reprodutibilidade computacional
site_author: Márcio Wilson

repo_url: https://github.com/marciow0205/bioinformatics-tutorials
repo_name: marciow0205/bioinformatics-tutorials
edit_uri: edit/main/docs/

extra_css:
  - assets/extra.css   # estilos próprios dos cartões e do cabeçalho (não depende da versão do Material)

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github     # ícone do GitHub no cabeçalho, ao lado da busca
  features:
    - navigation.tabs          # abas superiores (Início, MwInSilico, Bioinformática...)
    - navigation.tabs.sticky   # abas continuam visíveis ao rolar a página
    - navigation.sections      # organiza os subtemas em blocos na lateral esquerda
    - navigation.top           # botão "Voltar ao topo"
    - navigation.indexes       # permite uma página de resumo para cada seção
    - navigation.footer        # navegação "Anterior / Próximo" no rodapé de cada página
    - content.code.copy        # botão de copiar código
    - content.tabs.link        # sincroniza abas de conteúdo (ex.: exemplos em Bash/Python) entre páginas
    - toc.follow                # o sumário lateral direito acompanha o scroll
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro

extra:
  # Ícones sociais que aparecem automaticamente no rodapé de TODAS as páginas.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/marciow0205
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/marcio-wilson/
      name: LinkedIn
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/MWInSilico
      name: Instagram
    - icon: fontawesome/solid/graduation-cap
      link: http://lattes.cnpq.br/8280972369170529
      name: Currículo Lattes

markdown_extensions:
  - admonition
  - attr_list                  # permite estilizar links como botões (usado na Home)
  - md_in_html                 # permite usar markdown (ex.: imagens) dentro de tags HTML como <center>
  - footnotes                  # faz as citações [^1] virarem notas de rodapé clicáveis de verdade
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - toc:                       # configuração do menu da direita (Tópicos da postagem)
      permalink: true          # cria um ícone de link ao lado dos títulos para facilitar o compartilhamento

plugins:
  - search
  - tags                        # a página com o marcador (docs/tags.md) é detectada automaticamente

nav:
  - Início: index.md
  - Sobre: sobre.md
  - MwInSilico:
    - "Postagens":
      - "O Dogma Central da Biologia": post1_dogma_central.md
      - "Sequenciamento de DNA: da descoberta às tecnologias modernas": post2_sequenciamento.md
      - "Sequenciamento Illumina na Prática": sequenciamento_illumina.md
      - "PacBio e Nanopore em Detalhe": sequenciamento_terceira_geracao.md
      - "Sequenciamento de Célula Única": sequenciamento_celula_unica.md
  - Bioinformática:
    - Análise de Dados:
      - "Introdução à Análise": bioinfo/analise/introducao.md
    - Bancos de Dados Públicos:
      - "Exploração do TCGA/GDC": bioinfo/bancos/exploracao_tcga.md
    - Plots:
      - "Gráficos em R": bioinfo/plot/graficos_r.md
    - Transcriptoma:
      - "Pipeline RNA-Seq (GEO → DEGs)": bioinfo/transcriptoma/rnaseq.md
      - "Container Apptainer do Pipeline": bioinfo/transcriptoma/apptainer_sandbox.md
      - "DESeq2 e a Estatística por Trás Dele": bioinfo/transcriptoma/deseq2_estatistica.md
  - Ferramentas e Infraestrutura:
    - "Apptainer/Singularity — Guia Geral": singularity_tutorial.md
    - "MkDocs e GitHub Pages": tutorial_mkdocs.md
  - Tags: tags.md
