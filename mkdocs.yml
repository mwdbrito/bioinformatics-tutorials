site_name: Tutoriais e Scripts - Márcio Wilson
site_description: Repositório de tutoriais, scripts de bioinformática e documentações
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro

markdown_extensions:
  - admonition
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - toc:
      permalink: true

nav:
  - Início: index.md
  - MwInSilico:
    - "Postagens":
      - "O Dogma Central da Biologia": post1_dogma_central.md
  - Bioinformática:
    - Análise de Dados:
      - "Introdução à Análise": bioinfo/analise/introducao.md
    - Bancos de Dados Públicos:
      - "Exploração do TCGA/GDC": bioinfo/bancos/exploracao_tcga.md
    - Plots:
      - "Gráficos em R": bioinfo/plot/graficos_r.md
    - Transcriptoma:
      - "Pipeline RNA-Seq (GEO → DEGs)": bioinfo/transcriptoma/rnaseq.md
      - "Container Apptainer do Pipeline": bioinfo/transcriptoma/apptainer_sandbox.md
  - Ferramentas e Infraestrutura:
    - "Apptainer/Singularity — Guia Geral": singularity_tutorial.md
    - "MkDocs e GitHub Pages": tutorial_mkdocs.md