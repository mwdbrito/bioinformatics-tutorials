site_name: MwInSilico
site_url: https://mwdbrito.github.io/bioinformatics-tutorials/
site_description: Postagens, tutoriais e scripts de bioinformática — genômica, transcriptômica e reprodutibilidade computacional, em português.
site_author: Márcio Wilson
copyright: >
  © 2026 Márcio Wilson · MwInSilico — conteúdo livre:
  textos sob <a href="https://creativecommons.org/licenses/by/4.0/deed.pt-br">CC BY 4.0</a>,
  código sob <a href="https://github.com/mwdbrito/bioinformatics-tutorials/blob/main/LICENSE">MIT</a>

repo_url: https://github.com/mwdbrito/bioinformatics-tutorials
repo_name: mwdbrito/bioinformatics-tutorials
edit_uri: edit/main/docs/

# Tutoriais em revisão: aparecem no "mkdocs serve" (para você continuar
# escrevendo), mas ficam FORA do site publicado pelo "mkdocs build/gh-deploy".
# Para publicar um tutorial, tire-o daqui e adicione-o ao "nav".
draft_docs: |
  tutoriais/

# Arquivos de apoio que não são páginas do site
exclude_docs: |
  includes/

extra_css:
  - assets/extra.css

theme:
  name: material
  custom_dir: overrides          # cabeçalho/rodapé dos posts, página 404
  language: pt-BR
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
  features:
    - navigation.tracking           # a URL acompanha a seção que está sendo lida
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes            # páginas index.md viram a "capa" de cada seção
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips              # glossário: definição aparece ao passar o mouse
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Mudar para modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Seguir o sistema

extra:
  instagram: https://www.instagram.com/mwinsilico/   # usado nos templates (overrides/)
  social:
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/mwinsilico/
      name: Instagram @MWInSilico
    - icon: fontawesome/brands/github
      link: https://github.com/mwdbrito
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/marcio-wilson/
      name: LinkedIn
    - icon: fontawesome/solid/graduation-cap
      link: http://lattes.cnpq.br/8280972369170529
      name: Currículo Lattes

markdown_extensions:
  - abbr                        # glossário automático (docs/includes/glossario.md)
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link para esta seção
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      auto_append:
        - docs/includes/glossario.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: pt
  - tags
  - redirects:
      # URLs antigas (já compartilhadas) continuam funcionando
      redirect_maps:
        post1_dogma_central.md: posts/dogma-central.md
        post2_sequenciamento.md: posts/sequenciamento-de-dna.md
        sequenciamento_illumina.md: posts/rna-seq-bulk.md
        sequenciamento_celula_unica.md: posts/rna-seq-celula-unica.md
        transcriptoma_espacial.md: posts/transcriptomica-espacial.md
        sequenciamento_terceira_geracao.md: posts/index.md
        bioinfo/transcriptoma/rnaseq.md: scripts/index.md
        bioinfo/transcriptoma/apptainer_sandbox.md: scripts/index.md
        bioinfo/transcriptoma/deseq2_estatistica.md: scripts/index.md
        bioinfo/bancos/exploracao_tcga.md: scripts/index.md
        bioinfo/analise/introducao.md: index.md
        bioinfo/plot/graficos_r.md: index.md
        singularity_tutorial.md: scripts/index.md
        tutorial_mkdocs.md: scripts/index.md

nav:
  - Início: index.md
  - Postagens:
    - posts/index.md
    - Fundamentos:
      - posts/dogma-central.md
      - posts/sequenciamento-de-dna.md
    - Como medimos o transcriptoma:
      - posts/rna-seq-bulk.md
      - posts/rna-seq-celula-unica.md
      - posts/transcriptomica-espacial.md
  - Scripts: scripts/index.md
  - Glossário: glossario.md
  - Tags: tags.md
  - Sobre: sobre.md
