<path d="M 340 245 Q 285.0 293.0 230 245" fill="none" stroke="#0097a7" stroke-width="2.8" stroke-dasharray="7,6" marker-end="url(#arrow)"/>
<text x="285.0" y="307" font-family='Helvetica, Arial, sans-serif' font-size="13" font-weight="600" font-style="normal" fill="#0097a7" text-anchor="middle">transcrição reversa</text>
<text x="285.0" y="325" font-family='Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" font-style="italic" fill="#78909c" text-anchor="middle">(retrovírus, telômeros)</text>
<path d="M 80 175 Q 145.0 129.0 210 175" fill="none" stroke="#26a69a" stroke-width="2.2" marker-end="url(#arrow)"/>
