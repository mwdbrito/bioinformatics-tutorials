<text x="430.0" y="434" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="italic" fill="#78909c" text-anchor="middle">Baseado em Crick (1970); Temin &amp; Mizutani (1970); Baltimore (1970)</text>
