<rect x="1" y="1" width="858" height="448" rx="16" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
<text x="40" y="50" font-family='Helvetica, Arial, sans-serif' font-size="21" font-weight="700" fill="#004d40" text-anchor="start">O Dogma Central — fluxo geral e transferências especiais</text>
