<text x="145.0" y="237" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="middle">armazena a informação</text>
<rect x="340" y="175" width="170" height="90" rx="12" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="425.0" y="213" font-family='Helvetica, Arial, sans-serif' font-size="26" font-weight="700" font-style="normal" fill="#004d40" text-anchor="middle">RNA</text>
<text x="425.0" y="237" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="middle">intermediário / funcional</text>
<rect x="630" y="175" width="170" height="90" rx="12" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="715.0" y="213" font-family='Helvetica, Arial, sans-serif' font-size="24" font-weight="700" font-style="normal" fill="#004d40" text-anchor="middle">Proteína</text>
