<path d="M 360 175 Q 425.0 129.0 490 175" fill="none" stroke="#26a69a" stroke-width="2.2" stroke-dasharray="7,6" marker-end="url(#arrow)"/>
<text x="425.0" y="123" font-family='Helvetica, Arial, sans-serif' font-size="12" font-weight="400" font-style="normal" fill="#00897b" text-anchor="middle">replicação viral</text>
<text x="715.0" y="299" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="600" font-style="normal" fill="#e57373" text-anchor="middle">proteína → DNA, RNA ou proteína</text>
<text x="715.0" y="316" font-family='Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" font-style="italic" fill="#78909c" text-anchor="middle">nunca observado (Crick, 1970)</text>
<line x1="673.0" y1="341" x2="757.0" y2="341" stroke="#e57373" stroke-width="2.5" marker-end="url(#arrow_coral)"/>
<line x1="707.0" y1="329" x2="723.0" y2="353" stroke="#e57373" stroke-width="3"/>
<line x1="707.0" y1="353" x2="723.0" y2="329" stroke="#e57373" stroke-width="3"/>
<line x1="40" y1="388" x2="78" y2="388" stroke="#00695c" stroke-width="3"/>
<text x="88" y="392" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="start">transferência geral (todas as células)</text>
<line x1="40" y1="410" x2="78" y2="410" stroke="#0097a7" stroke-width="2.8" stroke-dasharray="7,6"/>
