<svg viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow_g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#78909c"/></marker></defs>
<rect x="1" y="1" width="858" height="458" rx="16" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
<text x="40" y="50" font-family='Helvetica, Arial, sans-serif' font-size="21" font-weight="700" fill="#004d40" text-anchor="start">Escala e complexidade dos dados genômicos</text>
<text x="40" y="75" font-family='Helvetica, Arial, sans-serif' font-size="13.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="start">do genoma completo a um único gene — a mesma informação em três escalas</text>
<circle cx="155" cy="250" r="130" fill="#e0f2f1" stroke="#00695c" stroke-width="3"/>
<text x="155" y="236" font-family='Helvetica, Arial, sans-serif' font-size="15.5" font-weight="700" font-style="normal" fill="#004d40" text-anchor="middle">Genoma humano</text>
<text x="155" y="258" font-family='Helvetica, Arial, sans-serif' font-size="13.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="middle">≈ 3,1 mil milhões</text>
<text x="155" y="276" font-family='Helvetica, Arial, sans-serif' font-size="13.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="middle">de pares de bases</text>
<line x1="279" y1="180" x2="440" y2="155" stroke="#78909c" stroke-width="1.6" stroke-dasharray="4,4"/>
<line x1="279" y1="320" x2="440" y2="345" stroke="#78909c" stroke-width="1.6" stroke-dasharray="4,4"/>
<circle cx="500" cy="250" r="85" fill="#e0f2f1" stroke="#0097a7" stroke-width="3"/>
<text x="500" y="234" font-family='Helvetica, Arial, sans-serif' font-size="15.5" font-weight="700" font-style="normal" fill="#004d40" text-anchor="middle">Exoma</text>
<text x="500" y="254" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="middle">≈ 1–2% do genoma</text>
<text x="500" y="271" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="middle">codifica proteínas</text>
<text x="500" y="288" font-family='Helvetica, Arial, sans-serif' font-size="11" font-weight="400" font-style="italic" fill="#78909c" text-anchor="middle">(≈ 20 mil genes, GENCODE)</text>
<line x1="581" y1="200" x2="700" y2="180" stroke="#78909c" stroke-width="1.6" stroke-dasharray="4,4"/>
<line x1="581" y1="300" x2="700" y2="320" stroke="#78909c" stroke-width="1.6" stroke-dasharray="4,4"/>
<circle cx="760" cy="250" r="55" fill="#b2dfdb" stroke="#004d40" stroke-width="3"/>
<text x="760" y="238" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="700" font-style="normal" fill="#004d40" text-anchor="middle">Um gene</text>
<text x="760" y="256" font-family='Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="middle">milhares de</text>
<text x="760" y="271" font-family='Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="middle">pares de bases</text>
<rect x="40" y="400" width="780" height="40" rx="10" fill="#eceff1" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="430.0" y="425" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="middle">Multiplique por dezenas, centenas ou milhares de amostras, tecidos, células ou condições — e a escala explode.</text>
<text x="430.0" y="444" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="italic" fill="#78909c" text-anchor="middle">Nurk et al. (2022) — genoma completo T2T-CHM13; Mudge et al. (2025) — GENCODE</text>
</svg>
