<line x1="320" y1="330" x2="450" y2="330" stroke="#00897b" stroke-width="5" stroke-linecap="round"/>
<line x1="320" y1="240" x2="450" y2="240" stroke="#00897b" stroke-width="5" stroke-linecap="round"/>
<line x1="320" y1="140" x2="450" y2="140" stroke="#00897b" stroke-width="5" stroke-linecap="round"/>
<rect x="490" y="120" width="170" height="280" rx="8" fill="#eceff1" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="575.0" y="106" font-family='Helvetica, Arial, sans-serif' font-size="13" font-weight="700" font-style="normal" fill="#0097a7" text-anchor="middle">+ ddGTP</text>
<line x1="510" y1="380" x2="640" y2="380" stroke="#0097a7" stroke-width="5" stroke-linecap="round"/>
