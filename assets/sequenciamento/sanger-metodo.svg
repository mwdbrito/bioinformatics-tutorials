<text x="195.0" y="106" font-family='Helvetica, Arial, sans-serif' font-size="13" font-weight="700" font-style="normal" fill="#004d40" text-anchor="middle">+ ddATP</text>
<line x1="130" y1="360" x2="260" y2="360" stroke="#004d40" stroke-width="5" stroke-linecap="round"/>
<line x1="130" y1="270" x2="260" y2="270" stroke="#004d40" stroke-width="5" stroke-linecap="round"/>
<line x1="130" y1="190" x2="260" y2="190" stroke="#004d40" stroke-width="5" stroke-linecap="round"/>
