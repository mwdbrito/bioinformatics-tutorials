<text x="765.0" y="106" font-family='Helvetica, Arial, sans-serif' font-size="13" font-weight="700" font-style="normal" fill="#f9a825" text-anchor="middle">+ ddCTP</text>
<line x1="700" y1="345" x2="830" y2="345" stroke="#f9a825" stroke-width="5" stroke-linecap="round"/>
