<text x="480.0" y="428" font-family='Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" font-style="italic" fill="#78909c" text-anchor="middle">tamanho crescente do fragmento → topo do gel</text>
<line x1="60" y1="395" x2="60" y2="125" stroke="#00695c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="35" y="260.0" font-family='Helvetica, Arial, sans-serif' font-size="11" font-weight="600" font-style="normal" fill="#00695c" text-anchor="middle">leitura</text>
