<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00695c"/></marker></defs>
<rect x="1" y="1" width="898" height="558" rx="16" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
<text x="40" y="50" font-family='Helvetica, Arial, sans-serif' font-size="20" font-weight="700" fill="#004d40" text-anchor="start">Sequenciamento de Sanger: terminação de cadeia</text>
<text x="40" y="74" font-family='Helvetica, Arial, sans-serif' font-size="13" font-weight="400" font-style="normal" fill="#455a64" text-anchor="start">os ddNTPs interrompem a síntese em cada posição da base correspondente</text>
<text x="40" y="100" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="600" font-style="normal" fill="#455a64" text-anchor="start">molde:</text>
<text x="40" y="120" font-family='Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" font-style="italic" fill="#78909c" text-anchor="start">5'-...GACCTAGGTCA...-3'</text>
