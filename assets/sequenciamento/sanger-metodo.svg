<text x="115" y="486" font-family='Helvetica, Arial, sans-serif' font-size="12" font-weight="400" font-style="normal" fill="#455a64" text-anchor="start">Sequência lida (do menor para o maior fragmento):</text>
<text x="115" y="510" font-family='Helvetica, Arial, sans-serif' font-size="15" font-weight="700" font-style="normal" fill="#004d40" text-anchor="start">5'-G-A-C-C-T-A-G-G-T-C-A-3'</text>
<text x="450.0" y="544" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="italic" fill="#78909c" text-anchor="middle">Baseado em Sanger, Nicklen &amp; Coulson (1977)</text>
