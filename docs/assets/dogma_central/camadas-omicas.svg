<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow_g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#78909c"/></marker></defs>
<rect x="1" y="1" width="858" height="558" rx="16" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
<text x="40" y="50" font-family='Helvetica, Arial, sans-serif' font-size="21" font-weight="700" fill="#004d40" text-anchor="start">As camadas ômicas: do genótipo ao fenótipo</text>
<rect x="50" y="90" width="760" height="78" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2.2"/>
<text x="72" y="120" font-family='Helvetica, Arial, sans-serif' font-size="17" font-weight="700" font-style="normal" fill="#004d40" text-anchor="start">Genômica</text>
<text x="72" y="142" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="start">DNA, genes e variantes</text>
<text x="788" y="120" font-family='Helvetica, Arial, sans-serif' font-size="12" font-weight="400" font-style="normal" fill="#455a64" text-anchor="end">Quais instruções e alterações estão presentes?</text>
<line x1="430.0" y1="169" x2="430.0" y2="177" stroke="#78909c" stroke-width="2.2" marker-end="url(#arrow_g)"/>
<rect x="50" y="178" width="760" height="78" rx="10" fill="#c3e6e3" stroke="#007a6c" stroke-width="2.2"/>
<text x="72" y="208" font-family='Helvetica, Arial, sans-serif' font-size="17" font-weight="700" font-style="normal" fill="#004d40" text-anchor="start">Epigenômica</text>
<text x="72" y="230" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="start">Cromatina e marcas epigenéticas</text>
<text x="788" y="208" font-family='Helvetica, Arial, sans-serif' font-size="12" font-weight="400" font-style="normal" fill="#455a64" text-anchor="end">Quais regiões estão acessíveis, ativas ou silenciadas?</text>
<line x1="430.0" y1="257" x2="430.0" y2="265" stroke="#78909c" stroke-width="2.2" marker-end="url(#arrow_g)"/>
<rect x="50" y="266" width="760" height="78" rx="10" fill="#a5dad5" stroke="#006b5e" stroke-width="2.2"/>
<text x="72" y="296" font-family='Helvetica, Arial, sans-serif' font-size="17" font-weight="700" font-style="normal" fill="#004d40" text-anchor="start">Transcriptômica</text>
<text x="72" y="318" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="start">RNAs e expressão gênica</text>
<text x="788" y="296" font-family='Helvetica, Arial, sans-serif' font-size="12" font-weight="400" font-style="normal" fill="#455a64" text-anchor="end">Quais genes e transcritos estão ativos, e em que quantidade?</text>
<line x1="430.0" y1="345" x2="430.0" y2="353" stroke="#78909c" stroke-width="2.2" marker-end="url(#arrow_g)"/>
<rect x="50" y="354" width="760" height="78" rx="10" fill="#88cec8" stroke="#005c4f" stroke-width="2.2"/>
<text x="72" y="384" font-family='Helvetica, Arial, sans-serif' font-size="17" font-weight="700" font-style="normal" fill="#004d40" text-anchor="start">Proteômica</text>
<text x="72" y="406" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="start">Proteínas e modificações pós-traducionais</text>
<text x="788" y="384" font-family='Helvetica, Arial, sans-serif' font-size="12" font-weight="400" font-style="normal" fill="#455a64" text-anchor="end">Quais máquinas moleculares estão presentes e funcionando?</text>
<line x1="430.0" y1="433" x2="430.0" y2="441" stroke="#78909c" stroke-width="2.2" marker-end="url(#arrow_g)"/>
<rect x="50" y="442" width="760" height="78" rx="10" fill="#6ac2ba" stroke="#004d40" stroke-width="2.2"/>
<text x="72" y="472" font-family='Helvetica, Arial, sans-serif' font-size="17" font-weight="700" font-style="normal" fill="#004d40" text-anchor="start">Metabolômica</text>
<text x="72" y="494" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="normal" fill="#455a64" text-anchor="start">Metabólitos</text>
<text x="788" y="472" font-family='Helvetica, Arial, sans-serif' font-size="12" font-weight="400" font-style="normal" fill="#455a64" text-anchor="end">Quais produtos e reações refletem o estado funcional da célula?</text>
<text x="50" y="76" font-family='Helvetica, Arial, sans-serif' font-size="11" font-weight="700" font-style="normal" fill="#78909c" text-anchor="start">GENÓTIPO</text>
<text x="50" y="542" font-family='Helvetica, Arial, sans-serif' font-size="11" font-weight="700" font-style="normal" fill="#78909c" text-anchor="start">FENÓTIPO</text>
<text x="430.0" y="544" font-family='Helvetica, Arial, sans-serif' font-size="12.5" font-weight="400" font-style="italic" fill="#78909c" text-anchor="middle">Baseado em Hasin, Seldin &amp; Lusis (2017)</text>
</svg>
