# Publica o site no GitHub Pages (branch gh-pages) a cada push na main.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Configura o autor dos commits na gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --strict faz o deploy falhar se houver link quebrado ou imagem faltando
      - run: mkdocs gh-deploy --force --strict
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
